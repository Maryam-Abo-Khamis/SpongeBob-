<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <title>SpongePop</title>
</head>
<body>
  <div class="page">
    <div class="sponge">
      <div class="container">
        <div class="high-part">
          <div class="left-hand"></div>
          <div class="body inside">
            <div class="circle inside">
              <span class="one x inside"></span>
              <span class="two x inside"></span>
              <span class="three x inside"></span>
              <span class="four x inside"></span>

              <span class="one y inside"></span>
              <span class="two y inside"></span>
              <span class="three y inside"></span>
              <span class="four y inside"></span>

              <span class="one z inside"></span>
              <span class="two z inside"></span>
              <span class="three z inside"></span>
              <span class="four z inside"></span>

              <span class="one s inside"></span>
              <span class="two s inside"></span>
              <span class="three s inside"></span>
              <span class="four s inside"></span>

              <span class="one m inside"></span>
              <span class="two m inside"></span>
              <span class="three m inside"></span>
              <span class="four m inside"></span>
            </div>
            <div class="eyes inside">
              <div class="left-eye inside">
              <span class="left-bobo inside"></span>
            </div>
              <div class="right-eye inside">
                <span class="right-bobo inside"></span>
              </div>
            </div>
            <div class="mouth  inside">
              <div class="tooth inside">
                <div class="part-high-teeth">
                  <hr>
                  <hr>
                  <hr>
                </div>
                <hr>
                <div class="part-low-teeth">
                  <hr>
                  <hr>
                  <hr>
                </div>
              </div>
            </div>
          </div>
          <div class="right-hand"></div>
        </div>
        <div class="low-part">
          <div class="pants">
            <div class="box-krafit"></div>
            <div class="krafit">
            </div>
          </div>
          <div class="legs">
            <div class="left-leg"></div>
            <div class="right-leg"></div>
          </div>
        </div>
        </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
