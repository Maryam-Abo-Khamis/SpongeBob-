<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <title>SpongePop</title>
</head>
<body>
  <div class="page">
    <div class="sponge">
      <div class="container">
        <div class="high-part">
          <div class="left-hand"></div>
          <div class="body">
            <div class="circle">
              <span class="one x"></span>
              <span class="two x"></span>
              <span class="three x"></span>
              <span class="four x"></span>

              <span class="one y"></span>
              <span class="two y"></span>
              <span class="three y"></span>
              <span class="four y"></span>

              <span class="one z"></span>
              <span class="two z"></span>
              <span class="three z"></span>
              <span class="four z"></span>

              <span class="one s"></span>
              <span class="two s"></span>
              <span class="three s"></span>
              <span class="four s"></span>

              <span class="one m"></span>
              <span class="two m"></span>
              <span class="three m"></span>
              <span class="four m"></span>
            </div>
            <div class="eyes">
              <div class="left-eye">
              <span class="left-bobo"></span>
            </div>
              <div class="right-eye">
                <span class="right-bobo"></span>
              </div>
            </div>
            <div class="mouth">
              <div class="tooth">
                <div class="part-high-teeth">
                  <hr>
                  <hr>
                  <hr>
                </div>
                <hr>
                <div class="part-low-teeth">
                  <hr>
                  <hr>
                  <hr>
                </div>
              </div>
            </div>
          </div>
          <div class="right-hand"></div>
        </div>
        <div class="low-part">
          <div class="pants">
            <div class="box-krafit"></div>
            <div class="krafit">
            </div>
          </div>
          <div class="legs">
            <div class="left-leg"></div>
            <div class="right-leg"></div>
          </div>
        </div>
        </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
